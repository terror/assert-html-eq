[package]
name = "assert-html-eq"
version = "0.1.0"
edition = "2024"

[lints.rust]
unreachable_pub = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
arbitrary_source_item_ordering = "deny"
pedantic = { level = "deny", priority = -1 }
wildcard_imports = "allow"

[dependencies]
pretty_assertions = "1.4.1"
scraper = "0.24.0"
stacker = "0.1.25"
unicode-normalization = "0.1.24"

[dev-dependencies]
indoc = "2.0.5"
